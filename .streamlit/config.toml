[theme]
base = "light"
primaryColor = "#0B6E99"
backgroundColor = "#F7FBFC"
secondaryBackgroundColor = "#E7F1F5"
textColor = "#102A43"
linkColor = "#0B6E99"
borderColor = "#C5DCE6"
showWidgetBorder = true
baseRadius = "0.5rem"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
